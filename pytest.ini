[pytest]
testpaths = tests
pythonpath = .
timeout = 60
markers =
    hardware: on-target tests that need real Magnets GPIO / Kittyflap hardware
# Default run: unit tests only (no GPIO). Coverage is opt-in via --cov (see tests/README.md).
addopts = -m "not hardware" -vv

[coverage:run]
branch = True
source = src
omit =
    */__pycache__/*

[coverage:report]
show_missing = True
skip_covered = False
precision = 1
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
